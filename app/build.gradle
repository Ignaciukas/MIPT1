plugins {
    id 'com.android.application'
}

android {
    namespace 'lt.mipt.helloworld'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.mipt.helloworld'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
